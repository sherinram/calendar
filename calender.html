
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>our fixed calendar Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #monthYear {
            min-width: 180px;
            text-align: center;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 12px 0;
            background: #dbeafe;
            border-radius: 5px;
        }

        .day {
            min-height: 75px;
            padding: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            color: #1e293b;
            text-align: left;
        }

        .day:hover {
            background: #eff6ff;
        }

        .other-month {
            color: #94a3b8;
        }

        .today {
            border: 2px solid #2563eb;
        }

        .selected {
            background: #dbeafe;
            border: 2px solid #2563eb;
        }

        .event-dot {
            display: block;
            margin-top: 6px;
            padding: 3px;
            background: #bfdbfe;
            border-radius: 4px;
            font-size: 11px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .event-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin: 5px 5px 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        #eventTitle {
            width: min(250px, 90%);
        }

        .event-item {
            padding: 10px;
            margin-top: 8px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
        }

        .delete-btn {
            float: right;
            background: #dc2626;
        }

        .message {
            color: #475569;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 10px;
            }

            .day {
                min-height: 55px;
                padding: 4px;
                font-size: 12px;
            }

            .event-dot {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My Calendar</h1>

    <div class="navigation">
        <button id="prevBtn">Previous</button>
        <h2 id="monthYear"></h2>
        <button id="nextBtn">Next</button>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="event-section">
        <h2 id="selectedDate">Select a date</h2>

        <form id="eventForm">
            <input
                type="text"
                id="eventTitle"
                placeholder="Enter event name"
                maxlength="100"
                required
            >

            <input type="time" id="eventTime">

            <button type="submit">Add Event</button>
        </form>

        <p id="message" class="message"></p>

        <h3>Events</h3>
        <div id="eventList">Loading events...</div>
    </div>
</div>

<script>
    // Node.js backend API
    const API = "/api/events";

    const calendar = document.getElementById("calendar");
    const monthYear = document.getElementById("monthYear");
    const selectedDateText = document.getElementById("selectedDate");
    const eventList = document.getElementById("eventList");
    const message = document.getElementById("message");

    let currentDate = new Date();
    let selectedDate = formatDate(new Date());
    let events = [];

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    async function loadEvents() {
        try {
            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Unable to load events.");
            }

            events = await response.json();
            renderCalendar();
            showEvents();
        } catch (error) {
            message.textContent =
                "Cannot connect to backend. Start your Node.js server.";
            eventList.textContent = "Events are unavailable.";
            renderCalendar();
        }
    }

    function renderCalendar() {
        calendar.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthYear.textContent = currentDate.toLocaleDateString(
            "en-US",
            { month: "long", year: "numeric" }
        );

        const weekdays = [
            "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
        ];

        weekdays.forEach(day => {
            const heading = document.createElement("div");
            heading.className = "weekday";
            heading.textContent = day;
            calendar.appendChild(heading);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const previousMonthDays = new Date(year, month, 0).getDate();
        const today = formatDate(new Date());

        // Previous month's dates
        for (let i = 0; i < firstDay; i++) {
            const dayNumber = previousMonthDays - firstDay + i + 1;
            const date = new Date(year, month - 1, dayNumber);
            createDay(date, true, today);
        }

        // Current month's dates
        for (let i = 1; i <= daysInMonth; i++) {
            const date = new Date(year, month, i);
            createDay(date, false, today);
        }

        // Next month's dates, to complete the final week
        const totalCells = firstDay + daysInMonth;
        const remaining = (7 - (totalCells % 7)) % 7;

        for (let i = 1; i <= remaining; i++) {
            const date = new Date(year, month + 1, i);
            createDay(date, true, today);
        }
    }

    function createDay(date, otherMonth, today) {
        const key = formatDate(date);
        const button = document.createElement("button");

        button.type = "button";
        button.className = "day";

        if (otherMonth) button.classList.add("other-month");
        if (key === today) button.classList.add("today");
        if (key === selectedDate) button.classList.add("selected");

        const number = document.createElement("div");
        number.textContent = date.getDate();
        button.appendChild(number);

        events
            .filter(event => event.date === key)
            .slice(0, 2)
            .forEach(event => {
                const dot = document.createElement("span");
                dot.className = "event-dot";
                dot.textContent = event.title;
                button.appendChild(dot);
            });

        button.addEventListener("click", () => {
            selectedDate = key;

            if (otherMonth) {
                currentDate = new Date(
                    date.getFullYear(),
                    date.getMonth(),
                    1
                );
            }

            renderCalendar();
            showEvents();
        });

        calendar.appendChild(button);
    }

    function showEvents() {
        const date = new Date(selectedDate + "T00:00:00");

        selectedDateText.textContent =
            "Events for " + date.toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

        eventList.innerHTML = "";

        const dayEvents = events
            .filter(event => event.date === selectedDate)
            .sort((a, b) => (a.time || "").localeCompare(b.time || ""));

        if (dayEvents.length === 0) {
            eventList.textContent = "No events for this date.";
            return;
        }

        dayEvents.forEach(event => {
            const item = document.createElement("div");
            item.className = "event-item";

            const title = document.createElement("strong");
            title.textContent = event.title;

            const time = document.createElement("span");
            time.textContent = event.time
                ? " — " + event.time
                : " — No time set";

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", () => {
                deleteEvent(event.id);
            });

            item.append(title, time, deleteButton);
            eventList.appendChild(item);
        });
    }

    document.getElementById("eventForm").addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            const title = document.getElementById("eventTitle").value.trim();
            const time = document.getElementById("eventTime").value;

            if (!title) return;

            message.textContent = "Saving event...";

            try {
                const response = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        date: selectedDate,
                        time: time
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Could not save event.");
                }

                this.reset();
                message.textContent = "Event added successfully.";
                await loadEvents();
            } catch (error) {
                message.textContent = error.message;
            }
        }
    );

    async function deleteEvent(id) {
        try {
            const response = await fetch(
                `${API}/${encodeURIComponent(id)}`,
                { method: "DELETE" }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Could not delete event.");
            }

            message.textContent = "Event deleted.";
            await loadEvents();
        } catch (error) {
            message.textContent = error.message;
        }
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() - 1,
            1
        );
        renderCalendar();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + 1,
            1
        );
        renderCalendar();
    });

    // Load events from the backend on startup
    loadEvents();
</script>

</body>
</html>
